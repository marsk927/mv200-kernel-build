name: build-hi3798mv200-docker-kernel

# E2D 内核 + Docker 三要素 云编译
# 基线: leandrotsampa/hisilicon-kernel @ atto-linux (E2D, 4.4.35)
# 策略: 用该树自带的 hi3798mv200_linux_defconfig 作基底 (上次黑屏教训: 外部 SDK defconfig 缺板级驱动)
#       再 merge docker_fragment.config 增量开 Docker 选项
# 产物: uImage.docker + modules.tar.gz

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout E2D kernel source
        uses: actions/checkout@v4
        with:
          repository: leandrotsampa/hisilicon-kernel
          ref: atto-linux
          fetch-depth: 1

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc libncurses5-dev u-boot-tools

      - name: Cache Linaro toolchain
        uses: actions/cache@v4
        with:
          path: ./toolchain
          key: linaro-gcc-4.9.4-2017.01-armhf

      - name: Download Linaro gcc 4.9.4
        run: |
          if [ ! -d ./toolchain/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf ]; then
            # 注意: Linaro 老版下载 URL 有变动史, 若 404 请到
            # https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/
            # 核对实际文件名后修正
            URL="https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/arm-linux-gnueabihf/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf.tar.xz"
            curl -fSL -o tc.tar.xz "$URL"
            mkdir -p toolchain && tar xf tc.tar.xz -C toolchain
          fi

      - name: Write docker fragment
        run: |
          mkdir -p frag
          cat > frag/docker_fragment.config <<'EOF'
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_MEM_RES_CTLR=y
          CONFIG_CGROUP_MEM_RES_CTLR_SWAP=y
          CONFIG_CGROUP_MEM_RES_CTLR_KMEM=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_RT_GROUP_SCHED=y
          CONFIG_BLK_CGROUP=y
          CONFIG_NET_CLS_CGROUP=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_FHANDLE=y
          CONFIG_VETH=m
          CONFIG_BRIDGE=m
          CONFIG_BRIDGE_NETFILTER=m
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=m
          CONFIG_NF_NAT=m
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_NETFILTER_XT_MARK=m
          CONFIG_IP_NF_IPTABLES=m
          CONFIG_IP_NF_FILTER=m
          CONFIG_IP_NF_TARGET_REJECT=m
          CONFIG_IP_NF_NAT=m
          CONFIG_IP_NF_TARGET_MASQUERADE=m
          CONFIG_IP_NF_MANGLE=m
          CONFIG_POSIX_MQUEUE=y
          CONFIG_OVERLAY_FS=m
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_DM_THIN=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_KEYS=y
          CONFIG_CRYPTO_SHA256=y
          CONFIG_CRYPTO_AES=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_NFCT=y
          CONFIG_IPV6=y
          CONFIG_PACKET=y
          EOF

      - name: Configure kernel (E2D base + docker merge)
        run: |
          export PATH="$PWD/toolchain/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf/bin:$PATH"
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make ARCH=arm hi3798mv200_linux_defconfig
          ./scripts/kconfig/merge_config.sh -m .config frag/docker_fragment.config
          make ARCH=arm CROSS_COMPILE=$CROSS_COMPILE olddefconfig
          # 打独立版本号, 避免与 rootfs 自带 4.4.35_ecoo 模块目录冲突
          ./scripts/config --file .config \
            --set-str LOCALVERSION "-docker1" \
            --disable LOCALVERSION_AUTO
          make ARCH=arm CROSS_COMPILE=$CROSS_COMPILE olddefconfig
          grep -E "CGROUPS=|CGROUP_PIDS|VETH|OVERLAY_FS|NET_NS" .config | head -10

      - name: Build zImage + modules
        run: |
          export PATH="$PWD/toolchain/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf/bin:$PATH"
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) ARCH=arm CROSS_COMPILE=$CROSS_COMPILE zImage modules

      - name: Pack uImage + modules
        run: |
          mkimage -A arm -O linux -T kernel -C none \
            -a 0x20000000 -e 0x20000000 -n "docker1" \
            -d arch/arm/boot/zImage uImage.docker1
          INSTALL_MOD_PATH=./modout make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules_install
          tar czf modules-docker1.tar.gz -C modout lib
          sha256sum uImage.docker1 modules-docker1.tar.gz | tee SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hi3798mv200-docker1
          path: |
            uImage.docker1
            modules-docker1.tar.gz
            SHA256SUMS.txt
